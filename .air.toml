root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/csp-reporter ./cmd/api/..."
bin = "./tmp/csp-reporter"
full_bin = "godotenv -f ./.env -- ./tmp/csp-reporter"
args_bin = []
delay = 1000
exclude_dir = [
	"assets",
	"tmp",
	"bin",
	"vendor",
	"testdata",
	"internal/templates",
	"internal/keys",
	"internal/i18n",
]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html", "env", "csv"]
include_file = []
kill_delay = 500
log = "error.log"
poll = false
poll_interval = 0
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
