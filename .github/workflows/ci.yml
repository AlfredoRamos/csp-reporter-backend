name: CI

on:
  push:
    branches: [master, dev]
  pull_request: {}

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25.0'

      - name: Install dependencies
        run: go mod tidy

      - name: Build app
        run: make build

  security:
    if: ${{ !contains(github.event.head_commit.message, 'skip security') }}
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25.0'

      - name: Install dependencies
        run: go mod tidy

      - name: Install utils
        run: make utils

      - name: Check source
        run: govulncheck -show=traces ./...

      - name: Build app
        run: make build

      - name: Check binary
        run: make lint-bin

      - name: Security scanner
        # Fix Go version detection
        env:
          GOTOOLCHAIN: auto
        uses: securego/gosec@master
        with:
          args: ./...

  lint:
    if: ${{ !contains(github.event.head_commit.message, 'skip lint') }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25.0'

      - name: Install utils
        run: make utils

      - name: Lint with vet
        run: go vet ./...

      - name: Lint with golangci-lint
        run: golangci-lint run ./...

      - name: Lint with deadcode
        run: deadcode -test ./...

      - name: Lint with modernize
        run: modernize -test ./...
